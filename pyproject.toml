[project]
name = "memsub"
version = "0.1.0"
description = "Unified memory substrate MVP (M0-M2): text substrate, compaction/eviction, NVMe delta checkpoints"
requires-python = ">=3.12,<3.13"
# BUILD.md ground rule 1: pinned environment. A transformers upgrade touching
# RoPE/cache code is a runtime_version change (spec 4.6) and invalidates
# certification data. Do not bump these without re-certifying.
dependencies = [
    "torch==2.7.1",
    "transformers==4.55.2",
    "safetensors==0.5.3",
    "numpy>=1.26,<3",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "modal>=1.3",
]

[project.scripts]
memsub = "memsub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memsub"]

# Local dev installs CPU-only torch (6GB laptop GPU cannot hold Qwen3-4B bf16);
# the Modal image installs the CUDA build of the same pinned version.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: golden acceptance tests (GT1-GT5 from BUILD.md)",
    "reference: requires the reference model (Qwen3-4B) on a real GPU; run via Modal",
]
